<app-oven-ambience />

<header class="hero">
  <div>
    <p class="eyebrow">{{ t().app.eyebrow }}</p>
    <h1 class="hero__title"><span class="hero__title-text">{{ t().app.title }}</span></h1>
  </div>
  <div class="hero__actions">
    <app-language-toggle />
    <app-theme-toggle />
    <button type="button" class="reset-button" (click)="store.reset()">
      {{ t().app.reset }}
    </button>
  </div>
</header>

<main class="layout">
  <section class="layout__inputs" [attr.aria-label]="t().app.inputs">
    <section class="panel" aria-labelledby="panel-method">
      <h2 class="panel__title" id="panel-method">{{ t().panels.method }}</h2>
      <app-method-switch
        [method]="doughInput().method"
        (methodChange)="store.setMethod($event)"
      />
    </section>

    @if (preDoughMethod(); as method) {
      <section class="panel panel--pre-dough" aria-labelledby="panel-pre-dough">
        <h2 class="panel__title" id="panel-pre-dough">{{ t().panels.preDough }}</h2>
        <app-pre-dough-panel
          [method]="method"
          [settings]="doughInput().preDough"
          (settingsChange)="store.updatePreDough($event)"
        />
      </section>
    }

    <section class="panel" aria-labelledby="panel-style">
      <h2 class="panel__title" id="panel-style">{{ t().panels.style }}</h2>
      <app-style-picker [styleId]="doughInput().style" (styleIdChange)="store.setStyle($event)" />
    </section>

    <section class="panel" aria-labelledby="panel-balls">
      <h2 class="panel__title" id="panel-balls">{{ t().panels.balls }}</h2>
      <div class="panel__row">
        <label class="panel__label" for="ball-count">{{ t().fields.count }}</label>
        <app-number-stepper
          inputId="ball-count"
          [label]="t().fields.ballCount"
          [value]="doughInput().ballCount"
          [limit]="limits.ballCount"
          (valueChange)="store.setBallCount($event)"
        />
      </div>
      <app-range-field
        [label]="t().fields.ballWeight"
        unit="g"
        [value]="doughInput().ballWeightGrams"
        [limit]="limits.ballWeightGrams"
        (valueChange)="store.setBallWeight($event)"
      />
      <app-dough-balls
        [ballCount]="doughInput().ballCount"
        [ballWeightGrams]="doughInput().ballWeightGrams"
      />
    </section>

    <section class="panel" aria-labelledby="panel-dough">
      <h2 class="panel__title" id="panel-dough">{{ t().panels.dough }}</h2>
      <app-range-field
        [label]="t().fields.hydration"
        unit="%"
        [value]="doughInput().hydrationPercent"
        [limit]="limits.hydrationPercent"
        (valueChange)="store.setHydration($event)"
      />
      <app-yeast-toggle
        [yeastType]="doughInput().yeastType"
        (yeastTypeChange)="store.setYeastType($event)"
      />
    </section>

    <section class="panel" aria-labelledby="panel-phases">
      <h2 class="panel__title" id="panel-phases">{{ t().panels.fermentation }}</h2>
      <app-schedule-templates
        [phases]="doughInput().phases"
        (applyTemplate)="store.applyScheduleTemplate($event)"
      />
      <app-phase-editor
        [phases]="doughInput().phases"
        [totalHours]="store.totalPhaseHours()"
        (addPhase)="store.addPhase($event)"
        (removePhase)="store.removePhase($event)"
        (updatePhase)="store.updatePhase($event.id, $event.patch)"
        (movePhase)="store.movePhase($event.id, $event.direction)"
      />
    </section>
  </section>

  <section class="layout__results" [attr.aria-label]="t().app.result">
    <section class="visual-slot" [attr.aria-label]="t().app.pizzaSize">
      <app-pizza-visual [diameterCm]="store.result().diameterCm" [styleId]="doughInput().style" />
    </section>
    <section class="panel panel--timeline" aria-labelledby="panel-timeline">
      <h2 class="panel__title" id="panel-timeline">{{ t().panels.schedule }}</h2>
      <app-fermentation-timeline
        [doughInput]="doughInput()"
        [equivalentHoursAt20C]="store.result().equivalentHoursAt20C"
      />
    </section>
    <app-recipe-card
      [doughInput]="doughInput()"
      [result]="store.result()"
      [totalHours]="store.totalPhaseHours()"
    />
  </section>
</main>
